name: sau_presence_guard
description: Integration-ready dynamic QR attendance, foreground geolocation and device attestation for SAU APP Flutter apps.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: 3.0.8
  device_info_plus: 13.3.0
  flutter_secure_storage: 11.2.0
  geolocator: 14.1.2
  http: 1.6.0
  mobile_scanner: 7.5.0
  qr_flutter: 4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: kz.sau.presence_guard
        pluginClass: SauPresenceGuardPlugin
      ios:
        pluginClass: SauPresenceGuardPlugin
