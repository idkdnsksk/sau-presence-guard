services:
  presence-guard-demo:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /data/presence-guard-demo.sqlite
      AUTH_SECRET: local-demo-auth-secret-change-me-0000001
      QR_SIGNING_SECRET: local-demo-qr-secret-change-me-00000002
      QR_SIGNING_KEY_ID: demo-v1
      DEMO_MODE: "true"
      ALLOW_DEMO_ATTESTATION: "true"
      ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    volumes:
      - presence-guard-demo-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  presence-guard-demo-data:
