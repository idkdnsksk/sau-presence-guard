services:
  presence-guard:
    build: .
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_PATH: /data/presence-guard.sqlite
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      QR_SIGNING_SECRET: ${QR_SIGNING_SECRET:?set QR_SIGNING_SECRET}
      QR_SIGNING_KEY_ID: ${QR_SIGNING_KEY_ID:-v1}
      DEMO_MODE: "false"
      ALLOW_DEMO_ATTESTATION: "false"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      APPLE_ALLOW_DEVELOPMENT: "false"
    volumes:
      - presence-guard-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/v1/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  presence-guard-data:
